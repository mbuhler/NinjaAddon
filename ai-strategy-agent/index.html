<!DOCTYPE html>
<html>
<head>
    <title>AI Strategy Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>AI Strategy Companion <span id="degradationStatus"></span></h1>

    <div id="memoryContextContainer">
      <h2>AI Memory Context</h2>
      <pre id="memoryContext">Loading...</pre>
    </div>

    <div>
        <h2>Recommendation Counts</h2>
        <canvas id="recChart"></canvas>
    </div>

    <div>
        <h2>Session Timeline</h2>
        <div id="timelineContainer"></div>
    </div>

    <div>
        <h2>Feedback Accuracy</h2>
        <canvas id="feedbackChart"></canvas>
    </div>

    <div>
        <h2>Rate Feedback</h2>
        <button onclick="rateFeedback('correct')">👍 Correct</button>
        <button onclick="rateFeedback('wrong')">👎 Wrong</button>
        <button onclick="rateFeedback('neutral')">🤷 Neutral</button>
    </div>

    <div>
        <h2>Strategy Suggestions</h2>
        <div id="suggestionsContainer"></div>
    </div>

    <div>
        <h2>Suggested Parameter Updates</h2>
        <div id="parameterUpdatesContainer"></div>
    </div>
        <button onclick="rateFeedback('wrong')">👎 Wrong</button>
        <button onclick="rateFeedback('neutral')">🤷 Neutral</button>
    </div>

    <script>
        async function fetchMemoryContext() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/journal/summary/${strategyName}`);
            const data = await response.json();
            document.getElementById("memoryContext").textContent = data.last_context_used;

            const degradationStatus = document.getElementById("degradationStatus");
            if (data.degraded) {
                degradationStatus.innerHTML = `⚠️ <span title="${data.degradation_reason}">Degraded</span>`;
            } else {
                degradationStatus.innerHTML = "";
            }
        }

        async function fetchTimeline() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/journal/timeline/${strategyName}`);
            const data = await response.json();

            const timelineContainer = document.getElementById('timelineContainer');
            data.forEach(item => {
                const entry = document.createElement('div');
                entry.innerHTML = `<strong>${item.timestamp}</strong>: ${item.recommendation} (Confidence: ${item.confidence_score}, Memory: ${item.memory_summary})`;
                timelineContainer.appendChild(entry);
            });
        }

        async function fetchRecommendationCounts() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/journal/recommendation-counts/${strategyName}`);
            const data = await response.json();

            const labels = data.recommendation_counts.map(item => item[0]);
            const counts = data.recommendation_counts.map(item => item[1]);

            const ctx = document.getElementById('recChart').getContext('2d');
            new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'Frequency',
                  data: counts,
                  backgroundColor: 'rgba(54, 162, 235, 0.6)'
                }]
              }
            });
        }

        async function rateFeedback(rating) {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const timestamp = "2025-07-22_032400"; // Example timestamp
            const response = await fetch(`/journal/rate-feedback/${strategyName}/${timestamp}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ rating: rating }),
            });
            const data = await response.json();
            console.log(data.message);
        }

        async function fetchFeedbackGrades() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/journal/feedback-grades/${strategyName}`);
            const data = await response.json();

            const labels = data.timeline.map(item => item.timestamp.split("T")[0]);
            const correctData = data.timeline.map(item => item.rating === 'correct' ? 1 : 0);
            const wrongData = data.timeline.map(item => item.rating === 'wrong' ? 1 : 0);
            const neutralData = data.timeline.map(item => item.rating === 'neutral' ? 1 : 0);

            const ctx = document.getElementById('feedbackChart').getContext('2d');
            new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [
                  { label: 'Correct', data: correctData, backgroundColor: 'rgba(75, 192, 192, 0.6)' },
                  { label: 'Wrong', data: wrongData, backgroundColor: 'rgba(255, 99, 132, 0.6)' },
                  { label: 'Neutral', data: neutralData, backgroundColor: 'rgba(201, 203, 207, 0.6)' }
                ]
              },
              options: { scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        async function fetchEvolveSuggestions() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/strategy/evolve-suggestions/${strategyName}`);
            const data = await response.json();

            const suggestionsContainer = document.getElementById('suggestionsContainer');
            data.suggested_changes.forEach(item => {
                const entry = document.createElement('div');
                entry.innerHTML = `<strong>${item.parameter}</strong>: ${item.suggestion} (Based on: ${item.based_on})`;
                suggestionsContainer.appendChild(entry);
            });
        }

        async function fetchConfigSuggestions() {
            const strategyName = "AllWeather_NQ_v38"; // Example strategy name
            const response = await fetch(`/journal/config-suggestions/${strategyName}`);
            const data = await response.json();

            const container = document.getElementById('parameterUpdatesContainer');
            data.suggestions.forEach(item => {
                const entry = document.createElement('div');
                entry.innerHTML = `<strong>${item.timestamp}</strong>: ${item.original_feedback} -> <code>${JSON.stringify(item.suggested_config_patch)}</code> <button>Apply</button> <button>Dismiss</button>`;
                container.appendChild(entry);
            });
        }

        fetchMemoryContext();
        fetchRecommendationCounts();
        fetchTimeline();
        fetchFeedbackGrades();
        fetchEvolveSuggestions();
        fetchConfigSuggestions();
    </script>
</body>
</html>
